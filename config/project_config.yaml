# Project (Traffic Signs) — runtime configuration
base_speed: 0.20
turn_speed: 0.18
stop_decel_frames: 8
stop_hold_seconds: 2.0
yield_hold_seconds: 0.5
yield_distance_m: 0.25

tag_family: "tag36h11"
tag_size_m: 0.065
detection_skip: 1

approach_distance_m: 1.5     # start approaching when sign is 1.2 m away
stop_distance_m: 0.25         # stop when stop sign is 0.30 m away
intersection_choice_m: 0.6    # choose turn when intersection sign is 0.8 m away

turn_choice_cooldown: 2.0
right_of_way_rule: "first_stopped"
camera_fov_deg: 120.0
tag_min_decision_margin: 5.0